<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptive Trading Bot · Live</title><link rel="stylesheet" href="/ui.css"><script src="/ui.js" defer></script></head><body>
<header><div><b>Adaptive Trading Bot</b><small>LIVE 0.3.6 · 真实资金 · 客户订阅版</small></div><nav aria-label="交易市场"><button id="spot-tab" class="active">现货 / Spot <span id="spot-state">未启动</span></button><button id="futures-tab">合约 / Futures <span id="futures-state">未启动</span></button></nav><button id="stop-all">停止全部自动策略</button></header>
<section id="license-panel" aria-label="Whop 订阅授权"><label for="license-key">Whop 软件许可证 / Software license</label><div><input id="license-key" type="password" autocomplete="off" placeholder="从购买账号的 Whop 订单复制；不是 API Key"><button id="license-activate">验证许可证 / Activate</button><button id="license-refresh">重新连接 / Reconnect</button><span id="license-state" role="status">未激活</span></div><small id="license-detail">一证一机。联网核验后仍需你手动启动交易。停止不等于平仓。</small></section><p id="notice">现货与合约使用独立配置及账本。切换页面不会启动交易；运行中的策略会继续，请查看顶部状态。</p>
<iframe id="spot-frame" title="现货实盘工作台" allow="clipboard-write"></iframe><iframe id="futures-frame" title="合约实盘工作台" allow="clipboard-write" hidden></iframe>
</body></html>
