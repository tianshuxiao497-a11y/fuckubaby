name: Device-bound desktop 0.5.0 native acceptance
on:
  push:
    branches: [codex/device-desktop-050]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
            arch: x64
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline device and subscription tests
        run: node --test products/subscription-service/device-seats.test.mjs products/subscription-cloudflare/device-worker.test.mjs
      - name: Native OS device identity and copied-profile protection
        run: node scripts/native-device-identity-smoke.mjs
      - name: Install pinned official desktop tooling
        working-directory: products/adaptive-spot-crossplatform
        run: npm ci --no-audit --no-fund
      - name: Install the official native Electron runtime
        working-directory: products/adaptive-spot-crossplatform
        run: node node_modules/electron/install.js
      - name: Stage the allowlisted Testnet-only engine
        run: node scripts/stage-crossplatform-engine.mjs
      - name: Build the native portable app
        working-directory: products/adaptive-spot-crossplatform
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --dir --publish never
      - name: Native offline app self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/native-desktop-smoke.mjs "exports/crossplatform-build-0.5.0/win-unpacked/Adaptive Spot Bot.exe" "exports/native-qa-windows-x64"
      - name: Enable the packaged Chromium SUID sandbox in this disposable Linux test runner
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root "exports/crossplatform-build-0.5.0/linux-unpacked/chrome-sandbox"
          sudo chmod 4755 "exports/crossplatform-build-0.5.0/linux-unpacked/chrome-sandbox"
      - name: Native offline app self-test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/native-desktop-smoke.mjs "exports/crossplatform-build-0.5.0/linux-unpacked/adaptive-spot-bot-desktop" "exports/native-qa-linux-x64"
      - name: Native offline app self-test (macOS)
        if: runner.os == 'macOS'
        run: node scripts/native-desktop-smoke.mjs "exports/crossplatform-build-0.5.0/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Adaptive Spot Bot.app/Contents/MacOS/Adaptive Spot Bot" "exports/native-qa-mac-${{ matrix.arch }}"
      - name: Build native distributable
        working-directory: products/adaptive-spot-crossplatform
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Install and launch the Debian package in the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./exports/crossplatform-build-0.5.0/*.deb
          xvfb-run -a node scripts/native-desktop-smoke.mjs "/usr/bin/adaptive-spot-bot-desktop" "exports/native-qa-linux-installed-x64"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-050-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            exports/crossplatform-build-0.5.0/*.exe
            exports/crossplatform-build-0.5.0/*.zip
            exports/crossplatform-build-0.5.0/*.tar.gz
            exports/crossplatform-build-0.5.0/*.deb
            exports/native-qa-*/RESULT.json
            exports/native-qa-*/FAILED.txt
            exports/native-qa-*/DESKTOP-PREVIEW.png
          retention-days: 7
