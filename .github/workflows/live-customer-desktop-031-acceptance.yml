name: Live Customer Trading Desktop 0.3.3 native offline acceptance
on:
  push:
    branches: [codex/live-customer-031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline order accounting, stop, reconnect and strategy regressions
        run: node --test products/live-customer-license/*.test.mjs products/subscription-live-cloudflare/*.test.mjs products/futures-live-pilot/live/*.test.mjs products/live-workbench/server.test.mjs products/spot-live-pilot/live/live.test.mjs tests/testnet-adaptive.test.mjs tests/profile-lease.test.mjs
      - name: Stage only public runtime source
        run: node scripts/stage-live-customer-desktop.mjs
      - name: Install pinned desktop dependencies
        working-directory: products/adaptive-live-customer-desktop
        run: npm ci --no-audit --no-fund
      - name: Fetch official native Electron runtime
        working-directory: products/adaptive-live-customer-desktop
        run: node node_modules/electron/install.js
      - name: Build native unpacked application
        working-directory: products/adaptive-live-customer-desktop
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --dir --publish never
      - name: Enable Chromium sandbox in the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root "exports/live-customer-build-0.3.3/linux-unpacked/chrome-sandbox"
          sudo chmod 4755 "exports/live-customer-build-0.3.3/linux-unpacked/chrome-sandbox"
      - name: Test packaged Windows app without credentials
        if: runner.os == 'Windows'
        run: node scripts/native-live-customer-smoke.mjs "exports/live-customer-build-0.3.3/win-unpacked/Adaptive Trading Bot Live Customer.exe" "exports/live-customer-native-qa-Windows-x64"
      - name: Test packaged Linux app without credentials
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/native-live-customer-smoke.mjs "exports/live-customer-build-0.3.3/linux-unpacked/adaptive-trading-bot-live-customer" "exports/live-customer-native-qa-Linux-x64"
      - name: Test packaged Mac app without credentials
        if: runner.os == 'macOS'
        run: node scripts/native-live-customer-smoke.mjs "exports/live-customer-build-0.3.3/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Adaptive Trading Bot Live Customer.app/Contents/MacOS/Adaptive Trading Bot Live Customer" "exports/live-customer-native-qa-Mac-${{ matrix.arch }}"
      - name: Build native installer and distributable
        working-directory: products/adaptive-live-customer-desktop
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Test installed Debian package in the disposable runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./exports/live-customer-build-0.3.3/*.deb
          xvfb-run -a node scripts/native-live-customer-smoke.mjs "/usr/bin/adaptive-trading-bot-live-customer" "exports/live-customer-native-qa-Linux-installed-x64"
      - name: Package native app with Chinese and English guides
        run: python scripts/package-live-customer-desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-customer-desktop-031-qa-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            exports/live-customer-native-qa-*/RESULT.json
            exports/live-customer-native-qa-*/FAILED.txt
            exports/live-customer-native-qa-*/*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: live-customer-desktop-031-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            exports/AdaptiveTradingBot-Live-0.3.3/*.zip
            exports/AdaptiveTradingBot-Live-0.3.3/RESULT-*.json
          retention-days: 7

  release:
    needs: native
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish customer 0.3.3]')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: live-customer-desktop-031-*
          path: native-results
      - name: Verify four native packages and publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-live-customer-ci.py
