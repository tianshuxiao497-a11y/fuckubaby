name: Live Personal Desktop 0.2.0 native offline acceptance
on:
  push:
    branches: [codex/live-desktop-020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline order accounting, stop, reconnect and strategy regressions
        run: node --test products/spot-live-pilot/live/live.test.mjs tests/testnet-adaptive.test.mjs
      - name: Stage only public runtime source
        run: node scripts/stage-live-desktop.mjs
      - name: Install pinned desktop dependencies
        working-directory: products/adaptive-spot-live-desktop
        run: npm ci --no-audit --no-fund
      - name: Fetch official native Electron runtime
        working-directory: products/adaptive-spot-live-desktop
        run: node node_modules/electron/install.js
      - name: Build native unpacked application
        working-directory: products/adaptive-spot-live-desktop
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --dir --publish never
      - name: Enable Chromium sandbox in the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root "exports/live-desktop-build-0.2.0/linux-unpacked/chrome-sandbox"
          sudo chmod 4755 "exports/live-desktop-build-0.2.0/linux-unpacked/chrome-sandbox"
      - name: Test packaged Windows app without credentials
        if: runner.os == 'Windows'
        run: node scripts/native-live-desktop-smoke.mjs "exports/live-desktop-build-0.2.0/win-unpacked/Adaptive Spot Bot Live.exe" "exports/live-native-qa-Windows-x64"
      - name: Test packaged Linux app without credentials
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/native-live-desktop-smoke.mjs "exports/live-desktop-build-0.2.0/linux-unpacked/adaptive-spot-bot-live-personal" "exports/live-native-qa-Linux-x64"
      - name: Test packaged Mac app without credentials
        if: runner.os == 'macOS'
        run: node scripts/native-live-desktop-smoke.mjs "exports/live-desktop-build-0.2.0/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Adaptive Spot Bot Live.app/Contents/MacOS/Adaptive Spot Bot Live" "exports/live-native-qa-Mac-${{ matrix.arch }}"
      - name: Build native installer and distributable
        working-directory: products/adaptive-spot-live-desktop
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Test installed Debian package in the disposable runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./exports/live-desktop-build-0.2.0/*.deb
          xvfb-run -a node scripts/native-live-desktop-smoke.mjs "/usr/bin/adaptive-spot-bot-live-personal" "exports/live-native-qa-Linux-installed-x64"
      - name: Package native app with Chinese and English guides
        run: python scripts/package-live-desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-desktop-020-qa-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            exports/live-native-qa-*/RESULT.json
            exports/live-native-qa-*/FAILED.txt
            exports/live-native-qa-*/DESKTOP-PREVIEW.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: live-desktop-020-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            exports/AdaptiveSpotBot-Live-Desktop-0.2.0/*.zip
            exports/AdaptiveSpotBot-Live-Desktop-0.2.0/RESULT-*.json
          retention-days: 7
